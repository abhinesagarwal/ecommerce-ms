
spring:
  application:
    name: order-ms
  datasource:
    url: jdbc:postgresql://localhost:5432/order-ms
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    compatibility-verifier:
      enabled: false

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true


kafka:
  bootstrap-servers: localhost:9092
  producer:
    serializer-class: org.apache.kafka.common.serialization.StringSerializer
    key-serializer: ${kafka.producer.serializer-class}
    value-serializer: ${kafka.producer.serializer-class}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always

resilience4j.circuitbreaker:
  instances:
    order-ms-circuit-breaker:
      registerHealthIndicator: true
      eventConsumerBufferSize: 10
      failureRateThreshold: 50
      minimumNumberOfCalls: 5
      automaticTransitionFromOpenToHalfOpenEnabled: true
      waitDurationInOpenState: 6s
      permittedNumberOfCallsInHalfOpenState: 3
      slidingWindowSize: 10
      slidingWindowType: COUNT_BASED